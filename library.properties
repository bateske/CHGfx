sentence=Wire-speed ST7735 graphics for the CH32X035, with a 4 bpp framebuffer and DMA.
paragraph=Drives an ST7735 128x128 panel at the CH32X035's hardware ceiling: SPI1 at 24 MHz with DMA on channel 3, a 16-colour 4 bpp framebuffer (a full RGB565 one will not fit in 20 KB), lookup-table palette expansion with staged palette changes and fades, selectable 12/16/18 bpp output, partial-rectangle updates, an interrupt-driven async present with flush progress for racing the beam, and a direct streaming mode for full-colour procedural rendering. Measured 90 fps full-frame at 16 bpp and 119 fps at 12 bpp. For games: a clip rectangle, palette-swapped span sprites that scale and rotate, rounded rectangles, ellipses, dither and remap fills, word-speed scrolling, outlined gradient banner text, six bitmap fonts including a 3x5 pixel font, and a PC simulator that runs sketches and catches drawing into a frame still being sent. Includes an optional Adafruit_GFX bridge.
category=Display
