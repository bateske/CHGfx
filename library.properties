name=CHGfx
version=1.1.0
author=bateske
maintainer=bateske <bateske@gmail.com>
sentence=Wire-speed ST7735 graphics for the CH32X035, with a 4 bpp framebuffer and DMA.
paragraph=Drives an ST7735 128x128 panel at the CH32X035's hardware ceiling: SPI1 at 24 MHz with DMA on channel 3, a 16-colour 4 bpp framebuffer (a full RGB565 one will not fit in 20 KB), lookup-table palette expansion, selectable 12/16/18 bpp output, partial-rectangle updates, an interrupt-driven async present so game logic overlaps the transfer, and a direct streaming mode that bypasses the framebuffer entirely for full 65536- or 262144-colour procedural rendering. Measured 90 fps full-frame at 16 bpp and 119 fps at 12 bpp, versus 2.4 fps for naive per-pixel drawing. Includes an optional Adafruit_GFX bridge so existing sketches keep working.
category=Display
